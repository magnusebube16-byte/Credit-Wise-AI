<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#155EEF">
  <title>Log In — CreditWise AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="signup-screen">

    <button class="back-btn" onclick="window.location.href='index.html'">
      ←
    </button>

    <div class="signup-content">

      <div class="step-label">
        WELCOME BACK
      </div>

      <h1>Welcome<br><span>back to CreditWise.</span></h1>

      <p class="signup-description">
        Log in to continue building your financial profile.
      </p>

      <form id="loginForm">

        <label>Email Address</label>
        <input
          id="loginEmail"
          type="email"
          placeholder="Enter your email"
          required
        >

        <label>Password</label>
        <input
          id="loginPassword"
          type="password"
          placeholder="Enter your password"
          required
        >

        <button class="primary-btn signup-submit" type="submit">
          Log In
          <span>→</span>
        </button>

      </form>

      <p class="login-text">
        Don't have an account?
        <button
          class="login-btn"
          type="button"
          onclick="window.location.href='signup.html'">
          Create account
        </button>
      </p>

    </div>

  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      const savedEmail = localStorage.getItem("userEmail");
      const savedPassword = localStorage.getItem("userPassword");

      if (!savedEmail || !savedPassword) {
        alert("No CreditWise account found. Please create an account first.");
        return;
      }

      if (email !== savedEmail || password !== savedPassword) {
        alert("Incorrect email or password.");
        return;
      }

      localStorage.setItem("loggedIn", "true");
      window.location.href = "dashboard.html";
    });
  </script>

</body>
</html>
